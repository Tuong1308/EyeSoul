services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eyesoul
      POSTGRES_PASSWORD: eyesoul
      POSTGRES_DB: eyesoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyesoul -d eyesoul"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
